<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>早餐吃到飽挑戰賽</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #2c3e50;
            overflow: hidden;
        }

        .page {
            position: relative;
            text-align: center;
            padding: 40px;
            background-color: white;
            border-radius: 20px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
            width: 80%;
            max-width: 500px;
        }

        /* 標題與按鈕 */
        .title-image { max-width: 300px; height: auto; margin-bottom: 20px; }
        h1 { font-size: 36px; color: #333; margin-bottom: 10px; }
        p { font-size: 18px; color: #666; }
        
        button {
            padding: 15px 35px;
            font-size: 22px;
            cursor: pointer;
            margin-top: 30px;
            background-color: #e74c3c;
            color: white;
            border: none;
            border-radius: 50px;
            box-shadow: 0 5px 0 #c0392b;
            transition: all 0.1s;
        }
        button:active { box-shadow: 0 2px 0 #c0392b; transform: translateY(3px); }

        /* --- 漢堡按鈕 --- */
        .menu-button {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 40px;
            height: 35px;
            background: none;
            border: none;
            cursor: pointer;
            z-index: 10;
        }
        .menu-button .line { width: 100%; height: 4px; background-color: #333; margin: 6px 0; border-radius: 2px; }

        /* --- 抽屜選單 (移除白底白框) --- */
        .menu-drawer {
            position: absolute;
            top: 0;
            right: 0;
            width: 100%;
            height: 100%;
            background-color: #bdc3c7; /* 灰色底 */
            z-index: 20;
            transform: translateX(100%);
            transition: transform 0.5s ease;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
        }
        .menu-drawer.active { transform: translateX(0); }

        .close-button {
            position: absolute;
            top: 20px;
            right: 20px;
            background: none;
            border: none;
            font-size: 40px;
            color: #333;
            cursor: pointer;
        }

        /* --- 分頁導覽列 --- */
        .tab-nav {
            margin-top: 60px;
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 30px;
        }
        .tab-btn {
            background-color: #7f8c8d; /* 分頁按鈕底色 */
            padding: 10px 20px;
            border-radius: 10px;
            color: white;
            font-weight: bold;
            border: none;
            cursor: pointer;
        }
        .tab-btn:active { background-color: #34495e; }

        /* --- 內容區域 --- */
        .tab-content { color: #333; padding: 20px; }
        .hidden { display: none; }

        @media screen and (max-width: 600px) {
            h1 { font-size: 28px; }
            button { width: 80%; padding: 15px; font-size: 18px; }
        }
    </style>
</head>
<body>

    <div id="home-page" class="page">
        <img src="title.jpg" alt="遊戲標題" class="title-image">
        <h1></h1> <p>各位孩子們 準備好了嗎？</p>
        <button onclick="showPage('game-page')">是的船長！</button>
    </div>

    <div id="game-page" class="page hidden">
        <button class="menu-button" onclick="toggleMenu()">
            <div class="line"></div>
            <div class="line"></div>
            <div class="line"></div>
        </button>

        <nav id="menu-drawer" class="menu-drawer">
            <button class="close-button" onclick="toggleMenu()">✖</button>
            
            <div class="tab-nav">
                <button class="tab-btn" onclick="switchTab('inventory')">圖鑑列表</button>
                <button class="tab-btn" onclick="switchTab('achievement')">成就清單</button>
            </div>

            <div id="inventory" class="tab-content">
                <h2>圖鑑列表</h2>
                <p>這裡放置你的圖鑑內容...</p>
            </div>

            <div id="achievement" class="tab-content hidden">
                <h2>成就清單</h2>
                <p>這裡放置你的成就項目...</p>
            </div>
        </nav>

        <h1>在蟹堡王當社畜中</h1>
        <p>讓章魚哥吹豎笛 與 派大星找到你了 功能</p>
        <button onclick="showPage('home-page')">下船</button>
    </div>

    <script>
        function showPage(pageId) {
            document.querySelectorAll('.page').forEach(page => page.classList.add('hidden'));
            document.getElementById(pageId).classList.remove('hidden');
        }

        function toggleMenu() {
            document.getElementById('menu-drawer').classList.toggle('active');
        }

        // 分頁切換邏輯
        function switchTab(tabId) {
            // 1. 隱藏所有內容
            document.querySelectorAll('.tab-content').forEach(content => {
                content.classList.add('hidden');
            });
            // 2. 顯示目標內容
            document.getElementById(tabId).classList.remove('hidden');
        }
    </script>
</body>
</html>
