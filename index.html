<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>早餐吃到飽挑戰賽</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', sans-serif;
            background-color: #2c3e50;
            color: white;
            overflow: hidden;
        }
        
        .page { text-align: center; width: 100%; position: absolute; }
        .hidden { display: none !important; }
        .title-image { max-width: 300px; height: auto; margin-bottom: 20px; }
        h1 { font-size: 40px; margin-bottom: 10px; }
        p { font-size: 20px; }
        
        .page button {
            padding: 15px 35px;
            font-size: 22px;
            cursor: pointer;
            margin-top: 30px;
            background-color: #e74c3c;
            color: white;
            border: none;
            border-radius: 50px;
            box-shadow: 0 5px 0 #c0392b;
        }
        
        .page button:active {
            box-shadow: none;
            transform: translateY(5px);
        }
        
        /* 漢堡選單樣式 */
        .menu-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            font-size: 30px;
            cursor: pointer;
            z-index: 100;
        }
        
        .menu-drawer {
            position: fixed;
            top: 0;
            right: -300px;
            width: 300px;
            height: 100%;
            background-color: #34495e;
            box-shadow: -5px 0 15px rgba(0,0,0,0.5);
            transition: right 0.3s;
            z-index: 99;
            padding-top: 60px;
        }
        
        .menu-drawer.active { right: 0; }
        .menu-tabs { display: flex; justify-content: space-around; border-bottom: 2px solid #2c3e50; }
        .tab-btn { background: none; border: none; color: white; padding: 10px; cursor: pointer; font-size: 18px; }
        .tab-content { padding: 20px; height: calc(100% - 120px); overflow-y: auto; }
        
        /* 圖鑑網格 */
        .creature-grid { display: grid; grid-template-columns: repeat(3, 100px); gap: 10px; justify-content: center; }
        .creature-item { text-align: center; font-size: 12px; }
        .creature-img { width: 80px; height: 80px; object-fit: cover; border-radius: 10px; cursor: pointer; transition: transform 0.2s; }
        .creature-img.is-locked { filter: brightness(0) invert(1); }
        .creature-img:hover { transform: scale(1.1); }
        
        /* 彈出視窗 */
        .modal { position: fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); display:none; justify-content:center; align-items:center; z-index:200; }
        .modal.active { display:flex; }
        .modal-content { background:#fff; color:#333; padding:20px; border-radius:15px; text-align:center; max-width:400px; width:90%; position:relative; }
        .modal-img { max-width:100%; max-height:200px; object-fit:contain; margin-bottom:15px; border-radius:10px; }
        .hint-text { text-align:left; font-size:16px; line-height:1.6; }
        
        /* 表單樣式 */
        .auth-container { display: flex; flex-direction: column; align-items: center; gap: 15px; margin-top: 20px; }
        .auth-container input { padding: 10px; font-size: 18px; border-radius: 5px; border: none; width: 250px; text-align: center; }
        .error-msg { color: #e74c3c; font-size: 14px; margin-top: -10px; height: 15px; }
        
        /* 困難模式排版：類似任務起源 */
        .scroll-content {
            background-color: rgba(0, 0, 0, 0.3);
            border-radius: 15px;
            padding: 20px;
            margin: 20px auto;
            width: 80%;
            max-height: 300px;
            overflow-y: auto;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .difficulty-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 20px;
        }
        
        .difficulty-container button { margin-top: 0; }
    </style>
</head>
<body>

    <div class="menu-btn" onclick="toggleMenu()">☰</div>

    <div id="menu-drawer" class="menu-drawer">
        <div class="menu-tabs">
            <button class="tab-btn" onclick="switchTab('tab-bag')">背包</button>
            <button class="tab-btn" onclick="switchTab('tab-book')">生物圖鑑</button>
        </div>
        <div id="tab-bag" class="tab-content"><h3>目前背包空空如也...</h3></div>
        <div id="tab-book" class="tab-content">
            <div class="creature-grid">
                <div class="creature-item"><img src="Numenius_phaeopus.jpg" class="creature-img is-locked" onclick="openModal(this.src)"><div class="creature-name" data-realname="中杓鷸">？？？</div></div>
                <div class="creature-item"><img src="Calidris_alpina.jpg" class="creature-img is-locked" onclick="openModal(this.src)"><div class="creature-name" data-realname="黑腹濱鷸">？？？</div></div>
                <div class="creature-item"><img src="Uca.jpg" class="creature-img is-locked" onclick="openModal(this.src)"><div class="creature-name" data-realname="招潮蟹">？？？</div></div>
                <div class="creature-item"><img src="Boleophthalmus_pectinirostris.jpg" class="creature-img is-locked" onclick="openModal(this.src)"><div class="creature-name" data-realname="大彈塗魚">？？？</div></div>
                <div class="creature-item"><img src="Ardea_cinerea.jpg" class="creature-img is-locked" onclick="openModal(this.src)"><div class="creature-name" data-realname="蒼鷺">？？？</div></div>
                <div class="creature-item"><img src="Egretta_eulophotes.jpg" class="creature-img is-locked" onclick="openModal(this.src)"><div class="creature-name" data-realname="唐白鷺">？？？</div></div>
                <div class="creature-item"><img src="Pluvialis_fulva.jpg" class="creature-img is-locked" onclick="openModal(this.src)"><div class="creature-name" data-realname="太平洋金班鴴">？？？</div></div>
                <div class="creature-item"><img src="Anser_cygnoides.jpg" class="creature-img is-locked" onclick="openModal(this.src)"><div class="creature-name" data-realname="鴻雁">？？？</div></div>
                <div class="creature-item"><img src="Gallinula_chloropus.jpg" class="creature-img is-locked" onclick="openModal(this.src)"><div class="creature-name" data-realname="紅冠水雞">？？？</div></div>
                <div class="creature-item"><img src="Sternula_albifrons.jpg" class="creature-img is-locked" onclick="openModal(this.src)"><div class="creature-name" data-realname="小燕鷗">？？？</div></div>
                <div class="creature-item"><img src="Anarhynchus_alexandrinus.jpg" class="creature-img is-locked" onclick="openModal(this.src)"><div class="creature-name" data-realname="東方環頸鴴">？？？</div></div>
            </div>
        </div>
    </div>

    <div id="home-page" class="page" onclick="skipTypewriter()">
        <img src="https://media.discordapp.net/attachments/1126781297594900543/1305413444005171241/d41a780e07172ec1.png?ex=6732f703&is=6731a583&hm=2aef31835560b49cb376e7f7ca72d4ccf1ccf11f44e1f7cbf5a2f5c765ccdfd0&=&format=webp&quality=lossless&width=531&height=531" class="title-image" alt="Title">
        <div style="display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 0 20px;">
            <div id="typewriter-text" style="min-height: 120px; max-width: 600px; font-size: 22px; line-height: 1.8; margin-bottom: 20px;"></div>
            <button id="start-btn" class="hidden" onclick="event.stopPropagation(); showPage('mode-page')">開始冒險</button>
        </div>
    </div>

    <div id="mode-page" class="page hidden">
        <h1>請選擇挑戰模式</h1>
        <div class="difficulty-container">
            <button onclick="showPage('normal-auth-page')">一般模式</button>
            <button onclick="showPage('hard-auth-page')">困難模式</button>
        </div>
    </div>

    <div id="normal-auth-page" class="page hidden">
        <h1>一般模式 - 團隊登入</h1>
        <div class="auth-container">
            <input type="text" id="login-username" placeholder="請輸入隊名" oninput="validateLogin()">
            <input type="password" id="login-password" placeholder="密碼 (6位數字)" maxlength="6" oninput="validateLogin()">
            <div id="login-pass-err" class="error-msg"></div>
            <button id="login-btn" onclick="handleAuth('login')" disabled style="opacity: 0.5;">開始遊戲</button>
        </div>
        <button onclick="showPage('mode-page')" style="background-color:#7f8c8d; box-shadow:0 5px 0 #95a5a6;">返回</button>
    </div>

    <div id="hard-auth-page" class="page hidden">
        <h1>困難模式 - 建立團隊</h1>
        <div class="auth-container">
            <input type="text" id="reg-username" placeholder="請輸入隊名" oninput="validateRegister()">
            <input type="password" id="reg-password" placeholder="設定密碼 (6位數字)" maxlength="6" oninput="validateRegister()">
            <div id="reg-pass-err" class="error-msg"></div>
            <button id="reg-btn" onclick="handleAuth('register')" disabled style="opacity: 0.5;">開始遊戲</button>
        </div>
        <button onclick="showPage('mode-page')" style="background-color:#7f8c8d; box-shadow:0 5px 0 #95a5a6;">返回</button>
    </div>

    <div id="game-page" class="page hidden">
        <h1>發現野生動物！</h1>
        <p>請拍攝並上傳照片來辨識生物</p>
        <div style="margin-top: 30px;">
            <input type="file" id="photo-input" accept="image/*" style="display: none;" onchange="handleFileUpload(event)">
            <button onclick="document.getElementById('photo-input').click()">開啟相機 / 上傳照片</button>
        </div>
    </div>

    <div id="hard-page" class="page hidden" onclick="skipHardTypewriter()">
        <h1>任務起源</h1>
        <div class="scroll-content">
            <div id="hard-typewriter-text" style="min-height: 150px; font-size: 18px; line-height: 1.8; text-align: left;"></div>
        </div>
        <button id="hard-read-btn" class="hidden" onclick="event.stopPropagation(); showPage('game-real-hard-content')">閱讀完畢</button>
    </div>

    <div id="game-real-hard-content" class="page hidden" onclick="skipQ1Typewriter()">
        <div style="display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100%;">
            <div id="q1-typewriter-text" style="font-size: 22px; line-height: 1.8; margin-bottom: 20px; width: 80%;"></div>
            <div id="q1-btns" class="difficulty-container hidden">
                <button onclick="event.stopPropagation(); showPage('high-tide-page')">漲潮</button>
                <button onclick="event.stopPropagation(); showPage('low-tide-page')">退潮</button>
            </div>
        </div>
    </div>

    <div id="high-tide-page" class="page hidden" onclick="skipHighTideTypewriter()">
        <h1>漲潮</h1>
        <div class="scroll-content">
            <div id="high-tide-text" style="min-height: 150px; font-size: 18px; line-height: 1.8; padding: 0 20px; text-align: left;"></div>
        </div>
        <div id="high-tide-action" class="hidden" style="display: flex; justify-content: center; align-items: center; width: 100%;"></div>
    </div>

    <div id="hint-modal" class="modal" onclick="closeHintModal()">
        <div class="modal-content" onclick="event.stopPropagation()">
            <h2 style="color: #f1c40f;">提示：</h2>
            <p style="font-size: 18px; line-height: 1.6; text-align: left;">
                沿著路往東南走會經過一條很小的溪流，觀察水的流向是流向大海還是陸地。
            </p>
        </div>
    </div>

    <div id="creature-modal" class="modal" onclick="closeModal()">
        <div class="modal-content" onclick="event.stopPropagation()">
            <img id=\"modal-img\" class="modal-img" src="" alt="Creature">
            <div class="hint-text">
                <p id="modal-text"></p>
            </div>
        </div>
    </div>

    <script>
        // --- 1. 設定與生物資料 ---
        const GLOBAL_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxtmxfP0xlAP-fK3UVEy_QzPbvAuQh-vJ_Vcs5iplYtC6xUOIO1b8YGzv-aKjfRH3aUWA/exec";
        const creatureData = {
            "Numenius_phaeopus.jpg": { name: "中杓鷸", hint: "(提示)", info: "(內容)", ebird: "https://ebird.org/species/whimbr" },
            "Calidris_alpina.jpg": { name: "黑腹濱鷸", hint: "(提示)", info: "(內容)", ebird: "https://ebird.org/species/whimbr" },
            "Uca.jpg": { name: "招潮蟹", hint: "(提示)", info: "(內容)", ebird: "https://ebird.org/species/whimbr" },
            "Boleophthalmus_pectinirostris.jpg": { name: "大彈塗魚", hint: "(提示)", info: "(內容)", ebird: "https://ebird.org/species/whimbr" },
            "Ardea_cinerea.jpg": { name: "蒼鷺", hint: "(提示)", info: "(內容)", ebird: "https://ebird.org/species/whimbr" },
            "Egretta_eulophotes.jpg": { name: "唐白鷺", hint: "(提示)", info: "(內容)", ebird: "https://ebird.org/species/whimbr" },
            "Pluvialis_fulva.jpg": { name: "太平洋金班鴴", hint: "(提示)", info: "(內容)", ebird: "https://ebird.org/species/whimbr" },
            "Anser_cygnoides.jpg": { name: "鴻雁", hint: "(提示)", info: "(內容)", ebird: "https://ebird.org/species/whimbr" },
            "Gallinula_chloropus.jpg": { name: "紅冠水雞", hint: "(提示)", info: "(內容)", ebird: "https://ebird.org/species/whimbr" },
            "Sternula_albifrons.jpg": { name: "小燕鷗", hint: "(提示)", info: "(內容)", ebird: "https://ebird.org/species/whimbr" },
            "Anarhynchus_alexandrinus.jpg": { name: "東方環頸鴴", hint: "(提示)", info: "(內容)", ebird: "https://ebird.org/species/whimbr" }
        };

        // --- 全域變數宣告區 ---
        const fullText = "歡迎來到陳冠宇與他的十二個惡魔，在這裡你需要扮演一位小小史學家，因為一個故事而來到許厝港，利用一些跟濕地有關的知識，一步一步解開任務，體會有關這個地方的歷史故事。";
        let charIndex = 0;
        let isTyping = false;
        let typeTimeout;
        let currentUser = null;

        const hardText = "某天，你從網路上看到了一個匿名文章，內容大概是一個繁榮商港的興衰紀錄文獻，他希望能有人找出這個地方是哪裡，當然也會給予相對的報酬。但是並沒有實際的地名可以依據。因此留言區當然開始吵到底是府城、鹿港或是大稻埕時……聰明的你仔細閱讀了文獻發現：這不太像目前熟知的各大港口呢？然後你去查了一下資料發現，老街溪與雙溪口溪的河口，這個地方剛好叫「許厝港濕地」。但，這是濕地啊？沒想到以前竟然是個海港？ 於是為了報酬（神奇小卡）你決定來這裡一探究竟～";
        let hardCharIndex = 0;
        let isHardTyping = false;
        let hardTypeTimeout;

        const q1MainText = "首先來到濕地，要確認現在是漲潮還是退潮。這會影響到等等的調查順序。\n\nQ1：請問現在是漲潮還是退潮？";
        const q1HintHtml = '<br><span style="font-size: 16px; color: #bdc3c7; text-decoration: underline; cursor: pointer;" onclick="event.stopPropagation(); openHintModal();">提示</span>';
        let q1CharIndex = 0;
        let isQ1Typing = false;
        let q1TypeTimeout;

        const highTideText = "看來是漲潮呢，那麼繼續往西南方那座橋（許厝港大橋）走好了。在這之前，剛才走過來的路上好像有看到一些水筆仔之類的植物長在泥巴地上，不愧是濕地呢。但我依稀記得好像有些水筆仔的葉子變黃了，難道秋天來得這麼快嗎？畢竟台灣的春夏秋冬是出了名的沒規則可言。但又很怪，一般植物在枯黃的時候會只枯黃一難道兩片葉子嗎？";
        let highTideCharIndex = 0;
        let isHighTideTyping = false;
        let highTideTypeTimeout;

        // --- 2. 打字機邏輯 (首頁) ---
        function startTypewriter() {
            const container = document.getElementById('typewriter-text');
            const btn = document.getElementById('start-btn');
            if(!container) return;
            container.innerHTML = "";
            charIndex = 0;
            isTyping = true;
            if(btn) btn.classList.add('hidden');
            
            function type() {
                if (charIndex < fullText.length) {
                    container.innerHTML += fullText.charAt(charIndex);
                    charIndex++;
                    typeTimeout = setTimeout(type, 100);
                } else {
                    completeTyping();
                }
            }
            type();
        }
        
        function skipTypewriter() {
            if (!isTyping) return;
            clearTimeout(typeTimeout);
            document.getElementById('typewriter-text').innerHTML = fullText;
            completeTyping();
        }
        
        function completeTyping() {
            isTyping = false;
            const btn = document.getElementById('start-btn');
            if(btn) btn.classList.remove('hidden');
        }

        // --- 3. 頁面導換邏輯 ---
        function showPage(pageId) {
            document.querySelectorAll('.page').forEach(page => page.classList.add('hidden'));
            
            const targetPage = document.getElementById(pageId);
            if (targetPage) {
                targetPage.classList.remove('hidden');
            }
            
            if (pageId === 'home-page') {
                startTypewriter();
            } else if (pageId === 'hard-page') {
                startHardTypewriter();
            } else if (pageId === 'game-real-hard-content') {
                startQ1Typewriter();
            } else if (pageId === 'high-tide-page') {
                initHighTidePage(); 
            }
        }

        window.onload = function() {
            startTypewriter();
        };
    
        function toggleMenu() {
            document.getElementById('menu-drawer').classList.toggle('active');
        }
    
        function switchTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(content => content.classList.add('hidden'));
            document.getElementById(tabId).classList.remove('hidden');
        }
    
        // --- 4. 帳號與登入邏輯 ---
        function validateRegister() {
            const user = document.getElementById('reg-username').value;
            const pass = document.getElementById('reg-password').value;
            const passErr = document.getElementById('reg-pass-err');
            const btn = document.getElementById('reg-btn');
            const isPassValid = /^\d{6}$/.test(pass);
            passErr.innerText = (pass.length > 0 && !isPassValid) ? "*非為6位數字" : "";
            btn.disabled = !(user.length > 0 && isPassValid);
            btn.style.opacity = btn.disabled ? "0.5" : "1";
        }
    
        function validateLogin() {
            const user = document.getElementById('login-username').value;
            const pass = document.getElementById('login-password').value;
            const passErr = document.getElementById('login-pass-err');
            const btn = document.getElementById('login-btn');
            const isPassValid = /^\d{6}$/.test(pass);
            passErr.innerText = (pass.length > 0 && !isPassValid) ? "*非為6位數字" : "";
            btn.disabled = !(user.length > 0 && isPassValid);
            btn.style.opacity = btn.disabled ? "0.5" : "1";
        }
    
        async function handleAuth(action) {
            const isReg = action === 'register';
            const user = document.getElementById(isReg ? 'reg-username' : 'login-username').value;
            const pass = document.getElementById(isReg ? 'reg-password' : 'login-password').value;
            const btn = document.getElementById(isReg ? 'reg-btn' : 'login-btn');
            
            document.querySelectorAll('.error-msg').forEach(el => el.innerText = "");
            btn.innerText = "驗證中...";
            btn.disabled = true;
        
            try {
                const response = await fetch(GLOBAL_SCRIPT_URL, {
                    method: "POST",
                    body: JSON.stringify({ action, username: user, password: pass })
                });
                const result = await response.json();
                if (result.result === 'success') {
                    currentUser = user;
                    alert(isReg ? "帳號建立成功！" : "登入成功！");
                    showPage(isReg ? 'hard-page' : 'game-page');
                } else {
                    const errId = isReg ? 'reg-user-err' : 'login-pass-err';
                    const targetErrEl = document.getElementById(errId);
                    if(targetErrEl) targetErrEl.innerText = "*" + result.message;
                    btn.disabled = false;
                }
            } catch (e) {
                console.error("Auth Error:", e);
                alert("系統回傳錯誤，請確認 GAS 權限設定");
                btn.disabled = false;
            } finally {
                btn.innerText = "開始遊戲";
            }
        }
    
        // --- 5. 照片上傳與辨識 ---
        async function handleFileUpload(event) {
            const file = event.target.files[0];
            if (!file) return;
        
            const btn = event.target.nextElementSibling;
            const originalText = btn.innerText;
            btn.innerText = "辨識中...";
            btn.disabled = true;
        
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = async function () {
                const base64Data = reader.result.split(",")[1];
                try {
                    const response = await fetch(GLOBAL_SCRIPT_URL, {
                        method: "POST",
                        body: JSON.stringify({
                            base64: base64Data,
                            type: file.type,
                            name: file.name
                        })
                    });
                    const result = await response.json();
                    if (result.isMatch) {
                        alert("恭喜！發現新生物！"); 
                        unlockCreature(result.target);
                    } else {
                        alert(result.message);
                    }
                } catch (error) {
                    console.error(error);
                    alert("連線失敗，請檢查網路或 GAS 設定");
                } finally {
                    btn.innerText = originalText;
                    btn.disabled = false;
                    event.target.value = "";
                }
            };
        }
        
        function unlockCreature(target) {
            const allImages = document.querySelectorAll('.creature-img');
            const targetLower = target.toLowerCase().trim();
            allImages.forEach(img => {
                const imgSrc = img.getAttribute('src').toLowerCase();
                if (imgSrc.indexOf(targetLower) !== -1) {
                    img.classList.remove('is-locked');
                    img.dataset.unlocked = "true";
                    const nameTag = img.parentElement.querySelector('.creature-name');
                    if (nameTag) {
                        nameTag.innerText = nameTag.dataset.realname;
                    }
                    img.style.transform = "scale(1.3)";
                    setTimeout(() => img.style.transform = "scale(1)", 500);
                }
            });
        }
        
        function openModal(imgSrc) {
            const modalImg = document.getElementById('modal-img');
            const modalTextElement = document.getElementById('modal-text');
            if(!modalImg || !modalTextElement) return;
            modalImg.src = imgSrc;
            const fileName = imgSrc.split('/').pop(); 
            const data = creatureData[fileName] || { name: "未知", hint: "無", info: "無" };
            const targetImgInList = Array.from(document.querySelectorAll('.creature-img')).find(img => 
                img.getAttribute('src').includes(fileName)
            );
            const isUnlocked = targetImgInList && targetImgInList.dataset.unlocked === "true";
            
            if (isUnlocked) {
                modalImg.style.filter = "none";
                let content = `<strong>${data.name}：</strong><br>${data.info}`;
                if (data.ebird) {
                    content += `<br><br><a href="${data.ebird}" target="_blank" style="color: #2c7a7b; text-decoration: underline;">查看 eBird 觀測紀錄</a>`;
                }
                modalTextElement.innerHTML = content;
            } else {
                modalImg.style.filter = "brightness(0) invert(1)";
                modalTextElement.innerHTML = `<strong>提示：</strong><br>${data.hint}`;
            }
            document.getElementById('creature-modal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('creature-modal').classList.remove('active');
        }
        
        // --- 6. 困難模式打字機邏輯 ---
        function startHardTypewriter() {
            const container = document.getElementById('hard-typewriter-text');
            const btn = document.getElementById('hard-read-btn');
            if(!container) return;
            
            container.innerHTML = "";
            hardCharIndex = 0;
            isHardTyping = true;
            if(btn) btn.classList.add('hidden');
            
            function type() {
                if (hardCharIndex < hardText.length) {
                    container.innerHTML += hardText.charAt(hardCharIndex);
                    hardCharIndex++;
                    hardTypeTimeout = setTimeout(type, 50);
                } else {
                    completeHardTyping();
                }
            }
            type();
        }
        
        function skipHardTypewriter() {
            if (!isHardTyping) return;
            clearTimeout(hardTypeTimeout);
            document.getElementById('hard-typewriter-text').innerHTML = hardText;
            completeHardTyping();
        }
        
        function completeHardTyping() {
            isHardTyping = false;
            document.getElementById('hard-read-btn').classList.remove('hidden');
        }

        // --- 7. Q1 模式打字機邏輯 ---
        function startQ1Typewriter() {
            const container = document.getElementById('q1-typewriter-text');
            const btns = document.getElementById('q1-btns');
            if(!container) return;
            
            container.innerHTML = "";
            q1CharIndex = 0;
            isQ1Typing = true;
            if(btns) btns.classList.add('hidden');
            
            function type() {
                if (q1CharIndex < q1MainText.length) {
                    let char = q1MainText.charAt(q1CharIndex);
                    container.innerHTML += char === "\n" ? "<br>" : char;
                    q1CharIndex++;
                    q1TypeTimeout = setTimeout(type, 60);
                } else {
                    container.innerHTML += q1HintHtml;
                    completeQ1Typing();
                }
            }
            type();
        }
        
        function skipQ1Typewriter() {
            if (!isQ1Typing) return;
            clearTimeout(q1TypeTimeout);
            document.getElementById('q1-typewriter-text').innerHTML = q1MainText.replace(/\n/g, "<br>") + q1HintHtml;
            completeQ1Typing();
        }
        
        function completeQ1Typing() {
            isQ1Typing = false;
            document.getElementById('q1-btns').classList.remove('hidden');
        }

        function openHintModal() {
            document.getElementById('hint-modal').classList.add('active');
        }
        
        function closeHintModal() {
            document.getElementById('hint-modal').classList.remove('active');
        }

        // --- 8. 漲潮頁面獨立邏輯 ---
        function initHighTidePage() {
            const textContainer = document.getElementById('high-tide-text');
            const actionBtnContainer = document.getElementById('high-tide-action');
            if(!textContainer) return;

            textContainer.innerHTML = "";
            if(actionBtnContainer) {
                actionBtnContainer.innerHTML = "";
                actionBtnContainer.classList.add('hidden');
            }

            isHighTideTyping = true;
            highTideCharIndex = 0;

            function type() {
                if (!isHighTideTyping) return;
                if (highTideCharIndex < highTideText.length) {
                    textContainer.innerHTML += highTideText.charAt(highTideCharIndex);
                    highTideCharIndex++;
                    highTideTypeTimeout = setTimeout(type, 50);
                } else {
                    completeHighTideTyping();
                }
            }
            type();
        }

        function skipHighTideTypewriter() {
            if (!isHighTideTyping) return;
            clearTimeout(highTideTypeTimeout);
            document.getElementById('high-tide-text').innerHTML = highTideText;
            completeHighTideTyping();
        }

        function completeHighTideTyping() {
            isHighTideTyping = false;
            const actionBtnContainer = document.getElementById('high-tide-action');
            if (actionBtnContainer) {
                actionBtnContainer.innerHTML = '<button id="to-next-question-btn" onclick="goToNextQuestion()">回答問題</button>';
                actionBtnContainer.classList.remove('hidden');
            }
        }

        function goToNextQuestion() {
            alert("前往下一題！");
        }
    </script>
</body>
</html>
