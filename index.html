<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>早餐吃到飽挑戰賽</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        /* --- 1. 全域設定 --- */
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', sans-serif;
            background-color: #2c3e50;
            color: white;
            overflow: hidden;
        }

        .page { text-align: center; width: 100%; position: absolute; }
        .hidden { display: none !important; }

        .title-image { max-width: 300px; height: auto; margin-bottom: 20px; }
        h1 { font-size: 40px; margin-bottom: 10px; }
        p { font-size: 20px; }

        /* 按鈕樣式 */
        .page button {
            padding: 15px 35px;
            font-size: 22px;
            cursor: pointer;
            margin-top: 30px;
            background-color: #e74c3c;
            color: white;
            border: none;
            border-radius: 50px;
            box-shadow: 0 5px 0 #c0392b;
        }
        .page button:active { box-shadow: 0 2px 0 #c0392b; transform: translateY(3px); }

        /* --- 2. 難度選單 (左右排列) --- */
        .difficulty-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 30px;
        }
        .difficulty-container button {
            margin-top: 0 !important;
            width: 140px;
        }

        /* --- 3. 選單按鈕 (全局固定) --- */
        .menu-button {
            position: fixed;
            top: 20px;
            right: 20px;
            width: 45px;
            height: 40px;
            background-color: #5d6d7e;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 0;
        }
        .menu-button .line { width: 70%; height: 4px; background-color: white; margin: 3px 0; border-radius: 2px; }

        .menu-drawer {
            position: fixed;
            top: 0;
            right: 0;
            width: 100%;
            height: 100%;
            background-color: #34495e;
            z-index: 2000;
            transform: translateX(100%);
            transition: transform 0.5s ease;
            padding: 20px;
            box-sizing: border-box;
            text-align: center;
        }
        .menu-drawer.active { transform: translateX(0); }

        .close-button {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 45px;
            height: 45px;
            background-color: #5d6d7e;
            border-radius: 8px;
            border: none;
            color: white;
            cursor: pointer;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 30px;
            line-height: 1;
        }

        .tab-nav { margin-top: 80px; display: flex; justify-content: center; gap: 20px; }
        .tab-btn { background-color: #5d6d7e; padding: 12px 25px; border-radius: 10px; color: white; border: none; font-size: 18px; cursor: pointer; }
        .tab-content { margin-top: 40px; color: #ecf0f1; }
    </style>
</head>
<body>

    <button class="menu-button" onclick="toggleMenu()">
        <div class="line"></div>
        <div class="line"></div>
        <div class="line"></div>
    </button>

    <nav id="menu-drawer" class="menu-drawer">
        <button class="close-button" onclick="toggleMenu()">×</button>
        <div class="tab-nav">
            <button class="tab-btn" onclick="switchTab('inventory')">圖鑑列表</button>
            <button class="tab-btn" onclick="switchTab('achievement')">成就清單</button>
        </div>
        <div id="inventory" class="tab-content"><h2>圖鑑列表</h2><p>比奇堡市民</p></div>
        <div id="achievement" class="tab-content hidden"><h2>成就清單</h2><p>每月蟹堡王最佳員工</p></div>
    </nav>

    <div id="home-page" class="page">
        <img src="title.jpg" alt="遊戲標題" class="title-image">
        <h1>各位孩子們 準備好了嗎？</h1>
        <button onclick="showPage('game-page')">是的船長！</button>
    </div>

    <div id="game-page" class="page hidden">
        <h1>請選擇難度</h1>
        <div class="difficulty-container">
            <button onclick="showPage('easy-page')">簡單</button>
            <button onclick="showPage('hard-page')">困難</button>
        </div>
        <button onclick="showPage('home-page')">回首頁</button>
    </div>

    <div id="easy-page" class="page hidden">
        <h1>叫海綿寶寶做蟹堡...</h1>
        <p>讓章魚哥吹豎笛 與 派大星找到你了 功能</p>
        <button onclick="showPage('game-page')">返回選擇</button>
    </div>

    <div id="hard-page" class="page hidden">
        <h1>叫章魚哥上班...</h1>
        <p>蟹老闆數錢 與 皮老闆找蟹堡秘方 功能</p>
        <button onclick="showPage('game-page')">返回選擇</button>
    </div>

    <script>
        function showPage(pageId) {
            document.querySelectorAll('.page').forEach(page => page.classList.add('hidden'));
            document.getElementById(pageId).classList.remove('hidden');
        }

        function toggleMenu() {
            document.getElementById('menu-drawer').classList.toggle('active');
        }

        function switchTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(content => content.classList.add('hidden'));
            document.getElementById(tabId).classList.remove('hidden');
        }
    </script>
</body>
</html>
