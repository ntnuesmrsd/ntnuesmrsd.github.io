<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>早餐吃到飽挑戰賽</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        /* --- 1. 背景與整體設定 --- */
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #2c3e50;
            overflow: hidden; /* 確保選單滑動時不會出現滾動條 */
        }

        /* --- 2. 畫面內容區塊 --- */
        .page {
            position: relative;
            text-align: center;
            padding: 40px;
            background-color: white;
            border-radius: 20px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
            width: 80%;
            max-width: 500px;
        }

        /* --- 3. 標題與按鈕設定 --- */
        .title-image { max-width: 300px; height: auto; margin-bottom: 20px; }
        h1 { font-size: 36px; color: #333; margin-bottom: 10px; }
        p { font-size: 18px; color: #666; }
        
        button {
            padding: 15px 35px;
            font-size: 22px;
            cursor: pointer;
            margin-top: 30px;
            background-color: #e74c3c;
            color: white;
            border: none;
            border-radius: 50px;
            box-shadow: 0 5px 0 #c0392b;
            transition: all 0.1s;
        }
        button:active { box-shadow: 0 2px 0 #c0392b; transform: translateY(3px); }

        /* --- 4. 漢堡選單樣式 (三橫圖案) --- */
        .menu-button {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 40px;
            height: 35px;
            background: none;
            border: none;
            cursor: pointer;
            padding: 0;
            z-index: 10; /* 在內容上方 */
        }
        .menu-button .line {
            width: 100%;
            height: 4px;
            background-color: #333; /* 可以換成你原本圖片的顏色 */
            margin: 6px 0;
            border-radius: 2px;
        }

        /* --- 5. 從右滑入的灰色選單畫面 --- */
        .menu-drawer {
            position: absolute;
            top: 0;
            right: 0;
            width: 100%;
            height: 100%;
            background-color: #ecf0f1; /* 選單灰底顏色 */
            border-radius: 20px;
            z-index: 20; /* 覆蓋在漢堡按鈕和內容上方 */
            box-sizing: border-radius; /* 確保 padding 不會影響圓角 */
            overflow: hidden; /* 內容超出時隱藏 */

            /* === 動畫關鍵：預設完全藏在右側 outside === */
            transform: translateX(100%);
            transition: transform 0.5s ease; /* 流暢滑動 */
        }

        /* 當選單被激活時，滑入 0% 的位置 */
        .menu-drawer.active {
            transform: translateX(0);
        }

        /* 選單右上角的關閉 X 圖案 */
        .close-button {
            position: absolute;
            top: 20px;
            right: 20px;
            background: none;
            border: none;
            font-size: 40px;
            color: #333;
            cursor: pointer;
            padding: 0;
            line-height: 35px;
            margin: 0;
            z-index: 30; /* 確保在灰色畫面的最上方 */
        }

        /* --- 6. 選單內容排版：平行對齊 --- */
        .menu-grid {
            margin-top: 100px; /* 與關閉按鈕拉開距離 */
            display: flex;     /* 關鍵：平行對齊 */
            justify-content: space-around; /* 內容均勻分佈在平行列上 */
            width: 100%;
            padding: 20px;
            box-sizing: border-radius;
        }

        /* 每個選項卡片 (用來包住選項文字和下方的內容預留區) */
        .menu-column {
            text-align: center;
            width: 45%; /* 大致寬度，兩個選項加上一個按鈕 */
        }

        /* 平行對齊的選項標題 (圖鑑、成就) */
        .menu-title-label {
            font-size: 24px;
            font-weight: bold;
            color: #333;
            margin-bottom: 20px;
        }

        /* === 內容預留區 === */
        .content-placeholder {
            min-height: 150px; /* 給個高度方便你看預留的位置 */
            background-color: white; /* 讓预留區區隔出來 */
            border-radius: 10px;
            padding: 10px;
            border: 2px dashed #bdc3c7; /* 虛線外框表示預留位置 */
        }

        .hidden { display: none; }

        /* --- 手機響應式設定 --- */
        @media screen and (max-width: 600px) {
            h1 { font-size: 28px; }
            button { width: 80%; padding: 15px; font-size: 18px; }
            .menu-grid { margin-top: 80px; gap: 10px;}
            .menu-title-label { font-size: 18px; }
        }
    </style>
</head>
<body>

    <div id="home-page" class="page">
        <img src="title.jpg" alt="遊戲標題" class="title-image">
        <h1></h1> <p>各位孩子們 準備好了嗎？</p>
        <button onclick="showPage('game-page')">是的船長！</button>
    </div>

    <div id="game-page" class="page hidden">
        <button class="menu-button" onclick="toggleMenu()">
            <div class="line"></div>
            <div class="line"></div>
            <div class="line"></div>
        </button>

        <nav id="menu-drawer" class="menu-drawer">
            <button class="close-button" onclick="toggleMenu()">✖</button>

            <div class="menu-grid">
                
                <div class="menu-column">
                    <div class="menu-title-label">圖鑑列表</div>
                    <div class="content-placeholder">
                        <p style="font-size: 14px; color: #999;">在此放入圖鑑內容</p>
                    </div>
                </div>

                <div class="menu-column">
                    <div class="menu-title-label">成就清單</div>
                    <div class="content-placeholder">
                        <p style="font-size: 14px; color: #999;">在此放入成就清單</p>
                    </div>
                </div>

            </div>
        </nav>

        <h1>在蟹堡王當社畜中</h1>
        <p>讓章魚哥吹豎笛 與 派大星找到你了 功能</p>
        <button onclick="showPage('home-page')">下船</button>
    </div>

    <script>
        // 頁面切換
        function showPage(pageId) {
            document.querySelectorAll('.page').forEach(page => {
                page.classList.add('hidden');
            });
            document.getElementById(pageId).classList.remove('hidden');
        }

        // 選單抽屜式開關
        function toggleMenu() {
            const drawer = document.getElementById('menu-drawer');
            // toggle 'active' class 來觸發 CSS 滑動動畫
            drawer.classList.toggle('active');
        }
    </script>
</body>
</html>
