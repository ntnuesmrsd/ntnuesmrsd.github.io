<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>早餐吃到飽挑戰賽</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        /* --- 1. 全域設定 --- */
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', sans-serif;
            background-color: #2c3e50; /* 背景顏色 */
            color: white; /* 文字變白色，因為沒有白底了 */
            overflow: hidden;
        }

        /* --- 2. 移除所有卡片樣式，內容直接置中 --- */
        .page {
            text-align: center;
            width: 100%;
        }

        .title-image { max-width: 300px; height: auto; margin-bottom: 20px; }
        h1 { font-size: 40px; margin-bottom: 10px; }
        p { font-size: 20px; }

        button {
            padding: 15px 35px;
            font-size: 22px;
            cursor: pointer;
            margin-top: 30px;
            background-color: #e74c3c;
            color: white;
            border: none;
            border-radius: 50px;
            box-shadow: 0 5px 0 #c0392b;
            transition: all 0.1s;
        }
        button:active { box-shadow: 0 2px 0 #c0392b; transform: translateY(3px); }

        /* --- 3. 選單按鈕 (固定在右上角) --- */
        .menu-button {
            position: fixed; /* 固定在螢幕，不隨內容移動 */
            top: 20px;
            right: 20px;
            width: 40px;
            height: 35px;
            background: none;
            border: none;
            cursor: pointer;
            z-index: 100;
        }
        .menu-button .line { width: 100%; height: 4px; background-color: white; margin: 6px 0; border-radius: 2px; }

        /* --- 4. 側邊選單 (隱藏於畫面外) --- */
        .menu-drawer {
            position: fixed; /* 覆蓋整個畫面 */
            top: 0;
            right: 0;
            width: 100%;
            height: 100%;
            background-color: #34495e; /* 選單底色 */
            z-index: 200;
            transform: translateX(100%); /* 完全滑出畫面外 */
            transition: transform 0.5s ease;
            padding: 20px;
            box-sizing: border-box;
            text-align: center;
        }
        .menu-drawer.active { transform: translateX(0); }

        .close-button {
            position: absolute;
            top: 20px;
            right: 20px;
            background: none;
            border: none;
            font-size: 40px;
            color: white;
            cursor: pointer;
        }

        /* --- 分頁樣式 --- */
        .tab-nav { margin-top: 80px; display: flex; justify-content: center; gap: 20px; }
        .tab-btn { background-color: #95a5a6; padding: 10px 20px; border-radius: 10px; color: white; border: none; cursor: pointer; }
        .tab-content { margin-top: 40px; color: #ecf0f1; }
        .hidden { display: none; }
    </style>
</head>
<body>

    <div id="home-page" class="page">
        <img src="title.jpg" alt="遊戲標題" class="title-image">
        <h1>挑戰賽</h1> 
        <p>各位孩子們 準備好了嗎？</p>
        <button onclick="showPage('game-page')">是的船長！</button>
    </div>

    <div id="game-page" class="page hidden">
        <button class="menu-button" onclick="toggleMenu()">
            <div class="line"></div>
            <div class="line"></div>
            <div class="line"></div>
        </button>

        <nav id="menu-drawer" class="menu-drawer">
            <button class="close-button" onclick="toggleMenu()">✖</button>
            
            <div class="tab-nav">
                <button class="tab-btn" onclick="switchTab('inventory')">圖鑑列表</button>
                <button class="tab-btn" onclick="switchTab('achievement')">成就清單</button>
            </div>

            <div id="inventory" class="tab-content">
                <h2>圖鑑列表</h2>
                <p>這裡顯示你抓到的蟹堡王角色...</p>
            </div>

            <div id="achievement" class="tab-content hidden">
                <h2>成就清單</h2>
                <p>達成目標：成為蟹堡王員工之星</p>
            </div>
        </nav>

        <h1>在蟹堡王當社畜中</h1>
        <p>遊戲核心功能運作中...</p>
        <button onclick="showPage('home-page')">下船</button>
    </div>

    <script>
        function showPage(pageId) {
            document.querySelectorAll('.page').forEach(page => page.classList.add('hidden'));
            document.getElementById(pageId).classList.remove('hidden');
        }

        function toggleMenu() {
            document.getElementById('menu-drawer').classList.toggle('active');
        }

        function switchTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(content => content.classList.add('hidden'));
            document.getElementById(tabId).classList.remove('hidden');
        }
    </script>
</body>
</html>
