<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>早餐吃到飽挑戰賽</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        /* --- 1. 背景與整體設定 --- */
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #2c3e50;
        }

        /* --- 2. 畫面內容區塊 --- */
        .page {
            position: relative; /* 關鍵：讓絕對定位的選單能固定在這個框框內 */
            text-align: center;
            padding: 40px;
            background-color: white;
            border-radius: 20px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
            width: 80%; /* 限制寬度 */
            max-width: 500px;
        }

        /* --- 3. 標題與按鈕設定 --- */
        .title-image { max-width: 300px; height: auto; margin-bottom: 20px; }
        h1 { font-size: 36px; color: #333; margin-bottom: 10px; }
        p { font-size: 18px; color: #666; }
        
        button {
            padding: 15px 35px;
            font-size: 22px;
            cursor: pointer;
            margin-top: 30px;
            background-color: #e74c3c;
            color: white;
            border: none;
            border-radius: 50px;
            box-shadow: 0 5px 0 #c0392b;
            transition: all 0.1s;
        }
        button:active { box-shadow: 0 2px 0 #c0392b; transform: translateY(3px); }

        /* --- 4. 漢堡選單樣式 --- */
        .menu-button {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 40px;
            height: 35px;
            background: none;
            border: none;
            cursor: pointer;
            padding: 0;
            z-index: 10;
        }
        .menu-button .line {
            width: 100%;
            height: 4px;
            background-color: #333;
            margin: 6px 0;
            border-radius: 2px;
        }

        /* --- 5. 選單遮罩動畫 (從右滑入) --- */
        .menu-overlay {
            position: absolute;
            top: 0;
            right: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(255, 255, 255, 0.98);
            border-radius: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            transform: translateX(100%); /* 預設在右邊外面 */
            transition: transform 0.5s ease; /* 滑動動畫 */
            z-index: 20;
        }
        .menu-overlay.active {
            transform: translateX(0); /* 滑動進來 */
        }

        .menu-content {
            display: flex;
            flex-direction: column; /* 讓內容垂直排列 */
            gap: 20px;
            font-size: 24px;
            font-weight: bold;
        }
        .menu-content a {
            text-decoration: none;
            color: #333;
        }

        .hidden { display: none; }

        /* --- 手機響應式設定 --- */
        @media screen and (max-width: 600px) {
            h1 { font-size: 28px; }
            button { width: 80%; padding: 15px; font-size: 18px; }
        }
    </style>
</head>
<body>

    <div id="home-page" class="page">
        <img src="title.jpg" alt="遊戲標題" class="title-image">
        <h1></h1> <p>各位孩子們 準備好了嗎？</p>
        <button onclick="showPage('game-page')">是的船長！</button>
    </div>

    <div id="game-page" class="page hidden">
        <button class="menu-button" onclick="toggleMenu()">
            <div class="line"></div>
            <div class="line"></div>
            <div class="line"></div>
        </button>

        <nav id="menu-overlay" class="menu-overlay">
            <div class="menu-content">
                <button class="menu-button" onclick="toggleMenu()">✖</button> <a href="#">圖鑑列表</a>
                <a href="#">成就清單</a>
            </div>
        </nav>

        <h1>在蟹堡王當社畜中</h1>
        <p>讓章魚哥吹豎笛 與 派大星找到你了 功能</p>
        <button onclick="showPage('home-page')">下船</button>
    </div>

    <script>
        // 頁面切換
        function showPage(pageId) {
            document.querySelectorAll('.page').forEach(page => {
                page.classList.add('hidden');
            });
            document.getElementById(pageId).classList.remove('hidden');
        }

        // 選單開關
        function toggleMenu() {
            const menu = document.getElementById('menu-overlay');
            menu.classList.toggle('active');
        }
    </script>
</body>
</html>
