<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>早餐吃到飽挑戰賽</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', sans-serif;
            background-color: #2c3e50;
            color: white;
            overflow: hidden;
        }
        
        .page { text-align: center; width: 100%; position: absolute; }
        .hidden { display: none !important; }
        .title-image { max-width: 300px; height: auto; margin-bottom: 20px; }
        h1 { font-size: 40px; margin-bottom: 10px; }
        p { font-size: 20px; }
        
        .page button {
            padding: 15px 35px;
            font-size: 22px;
            cursor: pointer;
            margin-top: 30px;
            background-color: #e74c3c;
            color: white;
            border: none;
            border-radius: 50px;
            box-shadow: 0 5px 0 #c0392b;
        }
        
        .page button:active {
            transform: translateY(5px);
            box-shadow: none;
        }
        
        .typewriter {
            font-size: 24px;
            margin: 20px auto;
            max-width: 80%;
            min-height: 100px;
            line-height: 1.6;
            word-wrap: break-word;
        }
        
        /* 漢堡選單樣式 */
        .menu-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            font-size: 30px;
            background: none;
            border: none;
            color: white;
            cursor: pointer;
            z-index: 1000;
        }
        
        .menu-drawer {
            position: fixed;
            top: 0;
            right: -300px;
            width: 300px;
            height: 100%;
            background-color: #34495e;
            box-shadow: -5px 0 15px rgba(0,0,0,0.5);
            transition: right 0.3s ease;
            z-index: 999;
            padding-top: 80px;
        }
        
        .menu-drawer.active { right: 0; }
        
        .menu-drawer button {
            display: block;
            width: 80%;
            margin: 15px auto;
            padding: 10px;
            font-size: 18px;
            background-color: #2c3e50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        
        /* 生物圖鑑樣式 */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            padding: 20px;
            max-height: 70vh;
            overflow-y: auto;
            width: 90%;
            margin: 0 auto;
        }
        
        .creature-card {
            background-color: #34495e;
            padding: 10px;
            border-radius: 10px;
            text-align: center;
        }
        
        .creature-img {
            width: 100%;
            height: 120px;
            object-fit: cover;
            border-radius: 5px;
            cursor: pointer;
            transition: transform 0.2s;
        }
        
        .creature-img.is-locked { filter: brightness(0); }
        .creature-name { margin-top: 8px; font-size: 16px; }
        
        /* 彈窗樣式 */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.8);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 2000;
        }
        
        .modal.active { display: flex; }
        
        .modal-content {
            background-color: #2c3e50;
            padding: 30px;
            border-radius: 15px;
            max-width: 500px;
            width: 90%;
            text-align: center;
            position: relative;
        }
        
        .modal-img { width: 100%; max-height: 300px; object-fit: contain; border-radius: 10px; margin-bottom: 15px; }
        
        /* 遊戲介面特殊微調 */
        .scroll-content {
            background: rgba(0,0,0,0.3);
            padding: 25px;
            border-radius: 15px;
            max-width: 700px;
            margin: 20px auto;
            height: 250px;
            overflow-y: auto;
            border: 1px solid #7f8c8d;
        }
        
        .difficulty-container button {
            margin: 15px;
            min-width: 150px;
        }
        
        .error-msg { color: #e74c3c; font-size: 14px; margin-top: 5px; display: block; }
    </style>
</head>
<body>

    <button class="menu-btn" onclick="toggleMenu()">☰</button>
    <div id="menu-drawer" class="menu-drawer">
        <button onclick="showPage('home-page'); toggleMenu();">回到首頁</button>
        <button onclick="showPage('game-page'); toggleMenu();">生物圖鑑</button>
        <button onclick="showPage('login-page'); toggleMenu();">登入帳號</button>
        <button onclick="showPage('register-page'); toggleMenu();">註冊帳號</button>
    </div>

    <div id="home-page" class="page" onclick="skipTypewriter()">
        <img class="title-image" src="https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEjVshf48_M8H6D6e06H3V_8N_wA6W6G_bC6p0X6U_bC6p0X6U_bC6p0X6U_bC6p0X6U_bC6p0X6U_bC6p0X6U_bC6p0X6U_bC6p0X6U_bC6p0X6U/s16000/%25E8%25A8%25B1%25E5%258E%259D%25E6%25B8%25AF.png" alt="Title Image">
        <div id="typewriter-text" class="typewriter"></div>
        <button id="start-btn" class="hidden" onclick="showPage('difficulty-page'); event.stopPropagation();">開始調查</button>
    </div>

    <div id="difficulty-page" class="page">
        <h1>請選擇難易度</h1>
        <p>難易度將會影響故事的體驗方式</p>
        <div class="difficulty-container">
            <button onclick="showPage('game-page')">簡單模式</button>
            <button onclick="showPage('hard-page')">困難模式</button>
        </div>
    </div>

    <div id="hard-page" class="page" onclick="skipHardTypewriter()">
        <h1>任務起源</h1>
        <div class="scroll-content">
            <div id="hard-typewriter-text" style="font-size: 18px; line-height: 1.8; text-align: left;"></div>
        </div>
        <button id="hard-read-btn" class="hidden" onclick="showPage('game-real-hard-content'); event.stopPropagation();">出發調查</button>
    </div>

    <div id="game-real-hard-content" class="page" onclick="skipQ1Typewriter()">
        <div style="display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100%;">
            <div id="q1-typewriter-text" style="font-size: 22px; line-height: 1.8; margin-bottom: 20px; width: 80%;"></div>
            <div id="q1-btns" class="difficulty-container hidden">
                <button onclick="showPage('high-tide-page')">漲潮</button>
                <button onclick="showPage('low-tide-page')">退潮</button>
            </div>
        </div>
    </div>

    <div id="high-tide-page" class="page" onclick="skipHighTideTypewriter()">
        <h1 style="color: #e74c3c;">漲潮</h1>
        <div class="scroll-content">
            <div id="high-tide-text" style="min-height: 150px; font-size: 18px; line-height: 1.8; text-align: left;"></div>
        </div>
        <div id="high-tide-action" class="hidden" style="display: flex; justify-content: center; align-items: center; width: 100%;"></div>
    </div>

    <div id="low-tide-page" class="page">
        <h1>退潮</h1>
        <p>這裡目前正在規劃中...</p>
        <button onclick="showPage('game-real-hard-content')">返回上一題</button>
    </div>

    <div id="game-page" class="page hidden">
        <h1>許厝港濕地生物圖鑑</h1>
        <div style="margin-bottom: 15px;">
            <button onclick="switchTab('tab-gallery')" style="margin: 5px; padding: 10px 20px; font-size: 16px;">查看圖鑑</button>
            <button onclick="switchTab('tab-upload')" style="margin: 5px; padding: 10px 20px; font-size: 16px;">上傳照片</button>
        </div>

        <div id="tab-gallery" class="tab-content">
            <div class="grid-container">
                <div class="creature-card"><img class="creature-img is-locked" src="https://raw.githubusercontent.com/An990310/demons/main/Numenius_phaeopus.jpg" onclick="openModal(this.src)"><div class="creature-name" data-realname="中杓鷸">？？？</div></div>
                <div class="creature-card"><img class="creature-img is-locked" src="https://raw.githubusercontent.com/An990310/demons/main/Calidris_alpina.jpg" onclick="openModal(this.src)"><div class="creature-name" data-realname="黑腹濱鷸">？？？</div></div>
                <div class="creature-card"><img class="creature-img is-locked" src="https://raw.githubusercontent.com/An990310/demons/main/Uca.jpg" onclick="openModal(this.src)"><div class="creature-name" data-realname="招潮蟹">？？？</div></div>
                <div class="creature-card"><img class="creature-img is-locked" src="https://raw.githubusercontent.com/An990310/demons/main/Boleophthalmus_pectinirostris.jpg" onclick="openModal(this.src)"><div class="creature-name" data-realname="大彈塗魚">？？？</div></div>
                <div class="creature-card"><img class="creature-img is-locked" src="https://raw.githubusercontent.com/An990310/demons/main/Ardea_cinerea.jpg" onclick="openModal(this.src)"><div class="creature-name" data-realname="蒼鷺">？？？</div></div>
                <div class="creature-card"><img class="creature-img is-locked" src="https://raw.githubusercontent.com/An990310/demons/main/Egretta_eulophotes.jpg" onclick="openModal(this.src)"><div class="creature-name" data-realname="唐白鷺">？？？</div></div>
                <div class="creature-card"><img class="creature-img is-locked" src="https://raw.githubusercontent.com/An990310/demons/main/Pluvialis_fulva.jpg" onclick="openModal(this.src)"><div class="creature-name" data-realname="太平洋金班鴴">？？？</div></div>
                <div class="creature-card"><img class="creature-img is-locked" src="https://raw.githubusercontent.com/An990310/demons/main/Anser_cygnoides.jpg" onclick="openModal(this.src)"><div class="creature-name" data-realname="鴻雁">？？？</div></div>
                <div class="creature-card"><img class="creature-img is-locked" src="https://raw.githubusercontent.com/An990310/demons/main/Gallinula_chloropus.jpg" onclick="openModal(this.src)"><div class="creature-name" data-realname="紅冠水雞">？？？</div></div>
                <div class="creature-card"><img class="creature-img is-locked" src="https://raw.githubusercontent.com/An990310/demons/main/Sternula_albifrons.jpg" onclick="openModal(this.src)"><div class="creature-name" data-realname="小燕鷗">？？？</div></div>
                <div class="creature-card"><img class="creature-img is-locked" src="https://raw.githubusercontent.com/An990310/demons/main/Anarhynchus_alexandrinus.jpg" onclick="openModal(this.src)"><div class="creature-name" data-realname="東方環頸鴴">？？？</div></div>
            </div>
        </div>

        <div id="tab-upload" class="tab-content hidden" style="padding: 40px;">
            <p>請拍攝或選擇一張濕地生物的照片進行生態紀錄：</p>
            <input type="file" id="creature-file" accept="image/*" style="display: none;" onchange="handleFileUpload(event)">
            <button onclick="document.getElementById('creature-file').click()">選擇/拍攝照片</button>
        </div>
    </div>

    <div id="login-page" class="page hidden">
        <h1>登入帳號</h1>
        <div style="max-width: 300px; margin: 0 auto; text-align: left;">
            <label>使用者名稱：</label><input type="text" id="login-username" oninput="validateLogin()" style="width:100%; padding:8px; margin:5px 0;"><br>
            <label>密碼 (6位數字)：</label><input type="password" id="login-password" oninput="validateLogin()" style="width:100%; padding:8px; margin:5px 0;">
            <span id="login-pass-err" class="error-msg"></span><br>
            <button id="login-btn" onclick="handleAuth('login')" style="width:100%; margin-top:10px;" disabled>開始遊戲</button>
        </div>
    </div>

    <div id="register-page" class="page hidden">
        <h1>建立新帳號</h1>
        <div style="max-width: 300px; margin: 0 auto; text-align: left;">
            <label>使用者名稱：</label><input type="text" id="reg-username" oninput="validateRegister()" style="width:100%; padding:8px; margin:5px 0;">
            <span id="reg-user-err" class="error-msg"></span><br>
            <label>密碼 (6位數字)：</label><input type="password" id="reg-password" oninput="validateRegister()" style="width:100%; padding:8px; margin:5px 0;">
            <span id="reg-pass-err" class="error-msg"></span><br>
            <button id="reg-btn" onclick="handleAuth('register')" style="width:100%; margin-top:10px;" disabled>建立帳號</button>
        </div>
    </div>

    <div id="creature-modal" class="modal" onclick="closeModal()">
        <div class="modal-content" onclick="event.stopPropagation()">
            <img id="modal-img" class="modal-img" src="" alt="Creature">
            <div class="hint-text"><p id="modal-text"></p></div>
        </div>
    </div>

    <div id="hint-modal" class="modal" onclick="closeHintModal()">
        <div class="modal-content" onclick="event.stopPropagation()">
            <h2 style="color: #f1c40f;">提示：</h2>
            <p style="font-size: 18px; line-height: 1.6; text-align: left;">
                沿著路往東南走會經過一條很小的溪流，觀察水的流向是流向大海還是陸地。
            </p>
        </div>
    </div>

    <script>
        // --- GAS 雲端資料庫串接網址 ---
        const GLOBAL_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxtmxfP0xlAP-fK3UVEy_QzPbvAuQh-vJ_Vcs5iplYtC6xUOIO1b8YGzv-aKjfRH3aUWA/exec";
        
        // --- 生物圖鑑資料庫 ---
        const creatureData = {
            "Numenius_phaeopus.jpg": { name: "中杓鷸", hint: "(提示)", info: "(內容)", ebird: "https://ebird.org/species/whimbr" },
            "Calidris_alpina.jpg": { name: "黑腹濱鷸", hint: "(提示)", info: "(內容)", ebird: "https://ebird.org/species/whimbr" },
            "Uca.jpg": { name: "招潮蟹", hint: "(提示)", info: "(內容)", ebird: "https://ebird.org/species/whimbr" },
            "Boleophthalmus_pectinirostris.jpg": { name: "大彈塗魚", hint: "(提示)", info: "(內容)", ebird: "https://ebird.org/species/whimbr" },
            "Ardea_cinerea.jpg": { name: "蒼鷺", hint: "(提示)", info: "(內容)", ebird: "https://ebird.org/species/whimbr" },
            "Egretta_eulophotes.jpg": { name: "唐白鷺", hint: "(提示)", info: "(內容)", ebird: "https://ebird.org/species/whimbr" },
            "Pluvialis_fulva.jpg": { name: "太平洋金班鴴", hint: "(提示)", info: "(內容)", ebird: "https://ebird.org/species/whimbr" },
            "Anser_cygnoides.jpg": { name: "鴻雁", hint: "(提示)", info: "(內容)", ebird: "https://ebird.org/species/whimbr" },
            "Gallinula_chloropus.jpg": { name: "紅冠水雞", hint: "(提示)", info: "(內容)", ebird: "https://ebird.org/species/whimbr" },
            "Sternula_albifrons.jpg": { name: "小燕鷗", hint: "(提示)", info: "(內容)", ebird: "https://ebird.org/species/whimbr" },
            "Anarhynchus_alexandrinus.jpg": { name: "東方環頸鴴", hint: "(提示)", info: "(內容)", ebird: "https://ebird.org/species/whimbr" }
        };

        // --- 各頁面文字內容定義 ---
        const fullText = "歡迎來到陳冠宇與他的十二個惡魔，在這裡你需要扮演一位小小史學家，因為一個故事而來到許厝港，利用一些跟濕地有關的知識，一步一步解開任務，體會有關這個地方的歷史故事。";
        const hardText = "某天，你從網路上看到了一個匿名文章，內容大概是一個繁榮商港的興衰紀錄文獻，他希望能有人找出這個地方是哪裡，當然也會給予相對的報酬。但是並沒有實際的地名可以依據。因此留言區當然開始吵到底是府城、鹿港或是大稻埕時……聰明的你仔細閱讀了文獻發現：這不太像目前熟知的各大港口呢？然後你去查了一下資料發現，老街溪與雙溪口溪的河口，這個地方剛好叫「許厝港濕地」。但，這是濕地啊？沒想到以前竟然是個海港？ 於是為了報酬（神奇小卡）你決定來這裡一探究竟～";
        const q1MainText = "首先來到濕地，要確認現在是漲潮還是退潮。這會影響到等等的調查順序。\n\nQ1：請問現在是漲潮還是退潮？";
        const q1HintHtml = '<br><span style="font-size: 16px; color: #bdc3c7; text-decoration: underline; cursor: pointer;" onclick="event.stopPropagation(); openHintModal();">提示</span>';
        const highTideText = "看來是漲潮呢，那麼繼續往西南方那座橋（許厝港大橋）走好了。在這之前，剛才走過來的路上好像有看到一些水筆仔之類的植物長在泥巴地上，不愧是濕地呢。但我依稀記得好像有些水筆仔的葉子變黃了，難道秋天來得這麼快嗎？畢竟台灣的春夏秋冬是出了名的沒規則可言。但又很怪，一般植物在枯黃的時候會只枯黃一難道一兩片葉子嗎？";

        // --- 控制變數 ---
        let charIndex = 0;
        let isTyping = false;
        let typeTimeout;
        let currentUser = null;

        let hardCharIndex = 0;
        let isHardTyping = false;
        let hardTypeTimeout;

        let q1CharIndex = 0;
        let isQ1Typing = false;
        let q1TypeTimeout;

        let highTideCharIndex = 0;
        let isHighTideTyping = false;
        let highTideTypeTimeout;

        // --- 1. 初始化載入設定 ---
        window.onload = function() {
            showPage('home-page');
        };

        // --- 2. 核心換頁引擎 ---
        function showPage(pageId) {
            document.querySelectorAll('.page').forEach(page => page.classList.add('hidden'));
            const targetPage = document.getElementById(pageId);
            if (targetPage) {
                targetPage.classList.remove('hidden');
            }
            
            // 當頁面被成功切換顯示後，各自觸發其專屬的打字機效果
            if (pageId === 'home-page') {
                startTypewriter();
            } else if (pageId === 'hard-page') {
                startHardTypewriter();
            } else if (pageId === 'game-real-hard-content') {
                startQ1Typewriter();
            } else if (pageId === 'high-tide-page') {
                initHighTidePage(); 
            }
        }

        // --- 3. 選單與導覽列頁籤功能 ---
        function toggleMenu() {
            document.getElementById('menu-drawer').classList.toggle('active');
        }
    
        function switchTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(content => content.classList.add('hidden'));
            document.getElementById(tabId).classList.remove('hidden');
        }

        // --- 4. 基礎首頁打字機功能 ---
        function startTypewriter() {
            const container = document.getElementById('typewriter-text');
            const btn = document.getElementById('start-btn');
            if(!container) return;
            container.innerHTML = "";
            charIndex = 0;
            isTyping = true;
            if(btn) btn.classList.add('hidden');
            
            function type() {
                if (charIndex < fullText.length) {
                    container.innerHTML += fullText.charAt(charIndex);
                    charIndex++;
                    typeTimeout = setTimeout(type, 100);
                } else {
                    completeTyping();
                }
            }
            type();
        }
        
        function skipTypewriter() {
            if (!isTyping) return;
            clearTimeout(typeTimeout);
            document.getElementById('typewriter-text').innerHTML = fullText;
            completeTyping();
        }
        
        function completeTyping() {
            isTyping = false;
            const btn = document.getElementById('start-btn');
            if(btn) btn.classList.remove('hidden');
        }

        // --- 5. 困難模式大綱前導打字機 ---
        function startHardTypewriter() {
            const container = document.getElementById('hard-typewriter-text');
            const btn = document.getElementById('hard-read-btn');
            if(!container) return;
            container.innerHTML = "";
            hardCharIndex = 0;
            isHardTyping = true;
            if(btn) btn.classList.add('hidden');
            
            function type() {
                if (hardCharIndex < hardText.length) {
                    container.innerHTML += hardText.charAt(hardCharIndex);
                    hardCharIndex++;
                    hardTypeTimeout = setTimeout(type, 50);
                } else {
                    completeHardTyping();
                }
            }
            type();
        }
        
        function skipHardTypewriter() {
            if (!isHardTyping) return;
            clearTimeout(hardTypeTimeout);
            document.getElementById('hard-typewriter-text').innerHTML = hardText;
            completeHardTyping();
        }
        
        function completeHardTyping() {
            isHardTyping = false;
            const btn = document.getElementById('hard-read-btn');
            if(btn) btn.classList.remove('hidden');
        }

        // --- 6. 第一題 (Q1) 問題打字機 ---
        function startQ1Typewriter() {
            const container = document.getElementById('q1-typewriter-text');
            const btns = document.getElementById('q1-btns');
            if(!container) return;
            container.innerHTML = "";
            q1CharIndex = 0;
            isQ1Typing = true;
            if(btns) btns.classList.add('hidden');
            
            function type() {
                if (q1CharIndex < q1MainText.length) {
                    let char = q1MainText.charAt(q1CharIndex);
                    container.innerHTML += char === "\n" ? "<br>" : char;
                    q1CharIndex++;
                    q1TypeTimeout = setTimeout(type, 60);
                } else {
                    container.innerHTML += q1HintHtml;
                    completeQ1Typing();
                }
            }
            type();
        }
        
        function skipQ1Typewriter() {
            if (!isQ1Typing) return;
            clearTimeout(q1TypeTimeout);
            document.getElementById('q1-typewriter-text').innerHTML = q1MainText.replace(/\n/g, "<br>") + q1HintHtml;
            completeQ1Typing();
        }
        
        function completeQ1Typing() {
            isQ1Typing = false;
            const btns = document.getElementById('q1-btns');
            if(btns) btns.classList.remove('hidden');
        }

        function openHintModal() { document.getElementById('hint-modal').classList.add('active'); }
        function closeHintModal() { document.getElementById('hint-modal').classList.remove('active'); }

        // --- 7. 選擇「漲潮」後的獨立劇情打字機與回答按鈕功能 ---
        function initHighTidePage() {
            const textContainer = document.getElementById('high-tide-text');
            const actionBtnContainer = document.getElementById('high-tide-action');
            if(!textContainer) return;

            textContainer.innerHTML = "";
            if(actionBtnContainer) {
                actionBtnContainer.innerHTML = "";
                actionBtnContainer.classList.add('hidden');
            }

            isHighTideTyping = true;
            highTideCharIndex = 0;

            function type() {
                if (!isHighTideTyping) return;
                if (highTideCharIndex < highTideText.length) {
                    textContainer.innerHTML += highTideText.charAt(highTideCharIndex);
                    highTideCharIndex++;
                    highTideTypeTimeout = setTimeout(type, 50);
                } else {
                    completeHighTideTyping();
                }
            }
            type();
        }

        function skipHighTideTypewriter() {
            if (!isHighTideTyping) return;
            clearTimeout(highTideTypeTimeout);
            document.getElementById('high-tide-text').innerHTML = highTideText;
            completeHighTideTyping();
        }

        function completeHighTideTyping() {
            isHighTideTyping = false;
            const actionBtnContainer = document.getElementById('high-tide-action');
            if (actionBtnContainer) {
                actionBtnContainer.innerHTML = '<button id="to-next-question-btn" onclick="goToNextQuestion()">回答問題</button>';
                actionBtnContainer.classList.remove('hidden');
            }
        }

        function goToNextQuestion() {
            alert("前往下一題！");
        }

        // --- 8. 後端 GAS 帳號權限驗證邏輯 ---
        function validateRegister() {
            const user = document.getElementById('reg-username').value;
            const pass = document.getElementById('reg-password').value;
            const passErr = document.getElementById('reg-pass-err');
            const btn = document.getElementById('reg-btn');
            const isPassValid = /^\d{6}$/.test(pass);
            passErr.innerText = (pass.length > 0 && !isPassValid) ? "*非為6位數字" : "";
            btn.disabled = !(user.length > 0 && isPassValid);
            btn.style.opacity = btn.disabled ? "0.5" : "1";
        }
    
        function validateLogin() {
            const user = document.getElementById('login-username').value;
            const pass = document.getElementById('login-password').value;
            const passErr = document.getElementById('login-pass-err');
            const btn = document.getElementById('login-btn');
            const isPassValid = /^\d{6}$/.test(pass);
            passErr.innerText = (pass.length > 0 && !isPassValid) ? "*非為6位數字" : "";
            btn.disabled = !(user.length > 0 && isPassValid);
            btn.style.opacity = btn.disabled ? "0.5" : "1";
        }
    
        async function handleAuth(action) {
            const isReg = action === 'register';
            const user = document.getElementById(isReg ? 'reg-username' : 'login-username').value;
            const pass = document.getElementById(isReg ? 'reg-password' : 'login-password').value;
            const btn = document.getElementById(isReg ? 'reg-btn' : 'login-btn');
            
            document.querySelectorAll('.error-msg').forEach(el => el.innerText = "");
            btn.innerText = "驗證中...";
            btn.disabled = true;
        
            try {
                const response = await fetch(GLOBAL_SCRIPT_URL, {
                    method: "POST",
                    body: JSON.stringify({ action, username: user, password: pass })
                });
                const result = await response.json();
                if (result.result === 'success') {
                    currentUser = user;
                    alert(isReg ? "帳號建立成功！" : "登入成功！");
                    showPage('game-page');
                } else {
                    const errId = isReg ? 'reg-user-err' : 'login-pass-err';
                    document.getElementById(errId).innerText = "*" + result.message;
                    btn.disabled = false;
                }
            } catch (e) {
                console.error("Auth Error:", e);
                alert("系統回傳錯誤，請確認 GAS 權限設定");
                btn.disabled = false;
            } finally {
                btn.innerText = "開始遊戲";
            }
        }
    
        // --- 9. 生物圖鑑照片上傳與辨識解鎖功能 ---
        async function handleFileUpload(event) {
            const file = event.target.files[0];
            if (!file) return;
        
            const btn = event.target.nextElementSibling;
            const originalText = btn.innerText;
            btn.innerText = "辨識中...";
            btn.disabled = true;
        
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = async function () {
                const base64Data = reader.result.split(",")[1];
                try {
                    const response = await fetch(GLOBAL_SCRIPT_URL, {
                        method: "POST",
                        body: JSON.stringify({
                            base64: base64Data,
                            type: file.type,
                            name: file.name
                        })
                    });
                    const result = await response.json();
                    if (result.isMatch) {
                        alert("恭喜！發現新生物！"); 
                        unlockCreature(result.target);
                    } else {
                        alert(result.message);
                    }
                } catch (error) {
                    console.error(error);
                    alert("連線失敗，請檢查網路或 GAS 設定");
                } finally {
                    btn.innerText = originalText;
                    btn.disabled = false;
                    event.target.value = "";
                }
            };
        }
        
        function unlockCreature(target) {
            const allImages = document.querySelectorAll('.creature-img');
            const targetLower = target.toLowerCase().trim();
            allImages.forEach(img => {
                const imgSrc = img.getAttribute('src').toLowerCase();
                if (imgSrc.indexOf(targetLower) !== -1) {
                    img.classList.remove('is-locked');
                    img.dataset.unlocked = "true";
                    const nameTag = img.parentElement.querySelector('.creature-name');
                    if (nameTag) {
                        nameTag.innerText = nameTag.dataset.realname;
                    }
                    img.style.transform = "scale(1.3)";
                    setTimeout(() => img.style.transform = "scale(1)", 500);
                }
            });
        }
        
        function openModal(imgSrc) {
            const modalImg = document.getElementById('modal-img');
            const modalTextElement = document.getElementById('modal-text');
            modalImg.src = imgSrc;
            const fileName = imgSrc.split('/').pop(); 
            const data = creatureData[fileName] || { name: "未知", hint: "無", info: "無" };
            const targetImgInList = Array.from(document.querySelectorAll('.creature-img')).find(img => 
                img.getAttribute('src').includes(fileName)
            );
            const isUnlocked = targetImgInList && targetImgInList.dataset.unlocked === "true";
            
            if (isUnlocked) {
                modalImg.style.filter = "none";
                let content = `<strong>${data.name}：</strong><br>${data.info}`;
                if (data.ebird) {
                    content += `<br><br><a href="${data.ebird}" target="_blank" style="color: #2c7a7b; text-decoration: underline;">查看 eBird 觀測紀錄</a>`;
                }
                modalTextElement.innerHTML = content;
            } else {
                modalImg.style.filter = "brightness(0) invert(1)";
                modalTextElement.innerHTML = `<strong>提示：</strong><br>${data.hint}`;
            }
            document.getElementById('creature-modal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('creature-modal').classList.remove('active');
        }
    </script>
</body>
</html>
