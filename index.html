<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>早餐吃到飽挑戰賽</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        /* --- 1. 全域設定 --- */
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', sans-serif;
            background-color: #2c3e50;
            color: white;
            overflow: hidden;
        }

        .page { text-align: center; width: 100%; position: absolute; }
        .hidden { display: none !important; }

        .title-image { max-width: 300px; height: auto; margin-bottom: 20px; }
        h1 { font-size: 40px; margin-bottom: 10px; }
        p { font-size: 20px; }

        /* 按鈕樣式 */
        .page button {
            padding: 15px 35px;
            font-size: 22px;
            cursor: pointer;
            margin-top: 30px;
            background-color: #e74c3c;
            color: white;
            border: none;
            border-radius: 50px;
            box-shadow: 0 5px 0 #c0392b;
        }
        .page button:active { box-shadow: 0 2px 0 #c0392b; transform: translateY(3px); }

        /* --- 2. 難度選單 (左右排列) --- */
        .difficulty-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 30px;
        }
        .difficulty-container button {
            margin-top: 0 !important;
            width: 140px;
        }

        /* --- 3. 選單按鈕 (全局固定) --- */
        .menu-button {
            position: fixed;
            top: 20px;
            right: 20px;
            width: 45px;
            height: 40px;
            background-color: #5d6d7e;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 0;
        }
        .menu-button .line { width: 70%; height: 4px; background-color: white; margin: 3px 0; border-radius: 2px; }

        .menu-drawer {
            position: fixed;
            top: 0;
            right: 0;
            width: 100%;
            height: 100%;
            background-color: #34495e;
            z-index: 2000;
            transform: translateX(100%);
            transition: transform 0.5s ease;
            padding: 20px;
            box-sizing: border-box;
            text-align: center;
        }
        .menu-drawer.active { transform: translateX(0); }

        .close-button {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 45px;
            height: 45px;
            background-color: #5d6d7e;
            border-radius: 8px;
            border: none;
            color: white;
            cursor: pointer;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 30px;
            line-height: 1;
        }

        .tab-nav { margin-top: 80px; display: flex; justify-content: center; gap: 20px; }
        .tab-btn { background-color: #5d6d7e; padding: 12px 25px; border-radius: 10px; color: white; border: none; font-size: 18px; cursor: pointer; }
        .tab-content { margin-top: 40px; color: #ecf0f1; text-align: center; }
        /* 圖鑑列表樣式 */
        #inventory {
            text-align: center;
            max-height: 60vh;
            overflow-y: auto; /* 超出高度時可滑動 */
            padding: 0 10px;
        }
        .location-group { margin-bottom: 25px; border-bottom: 1px solid #5d6d7e; padding-bottom: 10px; }
        .location-title {
            color: #f1c40f;
            font-size: 20px;
            margin-bottom: 10px;
            text-align: center; /* 只要加上這一行，所有使用這個類別的標題都會置中 */
        }
        .grid-container { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px;  justify-items: center; /* 這能確保 grid 內的項目內容也是置中的 */
        }
        .creature-item { text-align: center; }
        /* 核心剪影效果 */
        .silhouette {
            width: 60px;
            height: 60px;
            filter: brightness(0) invert(1);
            object-fit: contain;
            margin: 0 auto;
            display: block;
            cursor: pointer;
        }
        /* --- 彈出視窗樣式 --- */
        .modal {
            display: none; /* 預設隱藏 */
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background-color: rgba(0, 0, 0, 0.9); /* 半透明深色背景 */
            z-index: 9999;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }
        .modal.active { display: flex; } /* 顯示時使用 */
        
        .modal-content {
            background: #34495e;
            padding: 30px;
            border-radius: 20px;
            text-align: center;
            max-width: 80%;
        }
        .modal-img {
            width: 200px; height: 200px;
            filter: brightness(0) invert(1); /* 放大後變成白色方便觀察 */
            object-fit: contain;
        }
        .hint-text { margin-top: 20px; font-size: 20px; color: #f1c40f; }
        /* 自定義上傳按鈕樣式 */
        .upload-btn {
            padding: 8px 18px;
            font-size: 14px;
            background-color: #27ae60;
            color: white;
            border: none;
            border-radius: 8px;
            box-shadow: 0 4px 0 #1e8449; /* 底部厚度感 */
            cursor: pointer; /* 關鍵：鼠標移上去變手指 */
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 5px;
            margin-top: 0 !important; /* 強制覆蓋原本 button 的 margin-top */
        }
        
        .upload-btn:hover {
            background-color: #2ecc71;
            transform: translateY(-2px);
            box-shadow: 0 6px 0 #1e8449;
        }
        
        .upload-btn:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 #1e8449;
        }
    </style>
</head>
<body>

    <button class="menu-button" onclick="toggleMenu()">
        <div class="line"></div>
        <div class="line"></div>
        <div class="line"></div>
    </button>

    <nav id="menu-drawer" class="menu-drawer">
        <button class="close-button" onclick="toggleMenu()">×</button>
        <div class="tab-nav">
            <button class="tab-btn" onclick="switchTab('inventory')">圖鑑列表</button>
            <button class="tab-btn" onclick="switchTab('achievement')">成就清單</button>
        </div>
            <div id="inventory" class="tab-content">
                <div style="display: flex; justify-content: center; align-items: center; gap: 15px; margin-bottom: 20px;">
                    <h2 style="margin: 0;">圖鑑列表</h2>
                    <input type="file" id="photo-upload" accept="image/*" style="display: none;" onchange="handleFileUpload(event)">
                    <button class="upload-btn" onclick="document.getElementById('photo-upload').click()">
                        📷 上傳照片
                    </button>
                </div>
        
        <div class="location-group">
            <div class="location-title">河口濕地</div>
            <div class="grid-container">
                <div class="creature-item" onclick="openModal('bird1.jpg', '這裡是內容 1')"><img src="bird1.jpg" class="silhouette"><p>中杓鷸</p></div>
                <div class="creature-item" onclick="openModal('bird_dunlin.jpg', '這裡是內容 2')"><img src="bird_dunlin.jpg" class="silhouette"><p>黑腹濱鷸</p></div>
                <div class="creature-item" onclick="openModal('crab.jpg', '這裡是內容 1')"><img src="crab.jpg" class="silhouette"><p>招潮蟹</p></div>
                <div class="creature-item" onclick="openModal('mudskipper.jpg', '這裡是內容 1')"><img src="mudskipper.jpg" class="silhouette"><p>大彈塗魚</p></div>
            </div>
        </div>
    
        <div class="location-group">
            <div class="location-title">感潮濕地</div>
            <div class="grid-container">
                <div class="creature-item" onclick="openModal('bird2.jpg', '這裡是內容 1')"><img src="bird2.jpg" class="silhouette"><p>蒼鷺</p></div>
                <div class="creature-item" onclick="openModal('bird_chinese_egret.jpg', '這裡是內容 1')"><img src="bird_chinese_egret.jpg" class="silhouette"><p>唐白鷺</p></div>
                <div class="creature-item" onclick="openModal('bird3.jpg', '這裡是內容 1')"><img src="bird3.jpg" class="silhouette"><p>太平洋金斑鴴</p></div>
            </div>
        </div>
    
        <div class="location-group">
            <div class="location-title">深水埤塘區</div>
            <div class="grid-container">
                <div class="creature-item" onclick="openModal('bird4.jpg', '這裡是內容 1')"><img src="bird4.jpg" class="silhouette"><p>鴻雁</p></div>
                <div class="creature-item" onclick="openModal('bird5.jpg', '這裡是內容 1')"><img src="bird5.jpg" class="silhouette"><p>紅冠水雞</p></div>
            </div>
        </div>
    
        <div class="location-group">
            <div class="location-title">小燕鷗復育區</div>
            <div class="grid-container">
                <div class="creature-item" onclick="openModal('bird6.jpg', '這裡是內容 1')"><img src="bird6.jpg" class="silhouette"><p>小燕鷗</p></div>
                <div class="creature-item" onclick="openModal('bird7.jpg', '這裡是內容 1')"><img src="bird7.jpg" class="silhouette"><p>東方環頸鴴</p></div>
            </div>
        </div>
    </div>
        <div id="achievement" class="tab-content hidden">
            <h2>成就清單</h2>
            
            <div class="location-group">
                <div class="location-title">新手任務</div> 
                <div class="grid-container">
                    <div class="creature-item" onclick="openModal('badge1.png', '恭喜你！在早餐挑戰賽中獲得最佳員工殊榮！')">
                        <img src="badge1.png" class="silhouette">
                        <p>最佳員工</p>
                    </div>
                </div>
            </div>
        
            <div class="location-group">
                <div class="location-title">隱藏秘辛</div>
                <div class="grid-container">
                    <div class="creature-item" onclick="openModal('badge2.png', '你找到了隱藏的美味秘方！')">
                        <img src="badge2.png" class="silhouette">
                        <p>秘方收藏家</p>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <div id="home-page" class="page">
        <img src="title.jpg" alt="遊戲標題" class="title-image">
        <h1>各位孩子們 準備好了嗎？</h1>
        <button onclick="showPage('game-page')">是的船長！</button>
    </div>

    <div id="game-page" class="page hidden">
        <h1>請選擇難度</h1>
        <div class="difficulty-container">
            <button onclick="showPage('easy-page')">簡單</button>
            <button onclick="showPage('hard-page')">困難</button>
        </div>
        <button onclick="showPage('home-page')">回首頁</button>
    </div>

    <div id="easy-page" class="page hidden">
        <h1>叫海綿寶寶做蟹堡...</h1>
        <p>讓章魚哥吹豎笛 與 派大星找到你了 功能</p>
        <button onclick="showPage('game-page')">返回選擇</button>
    </div>

    <div id="hard-page" class="page hidden">
        <h1>叫章魚哥上班...</h1>
        <p>蟹老闆數錢 與 皮老闆找蟹堡秘方 功能</p>
        <button onclick="showPage('game-page')">返回選擇</button>
    </div>

    <script>
        function showPage(pageId) {
            document.querySelectorAll('.page').forEach(page => page.classList.add('hidden'));
            document.getElementById(pageId).classList.remove('hidden');
        }
    
        function toggleMenu() {
            document.getElementById('menu-drawer').classList.toggle('active');
        }
    
        function switchTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(content => content.classList.add('hidden'));
            document.getElementById(tabId).classList.remove('hidden');
        }
    
        function openModal(imgSrc, hintText) {
            console.log("點擊成功！嘗試開啟圖片:", imgSrc); // 除錯用，如果點擊時沒看到這行，代表按鈕沒觸發
            document.getElementById('modal-img').src = imgSrc;
            document.getElementById('modal-text').innerText = hintText;
            document.getElementById('creature-modal').classList.add('active');
        }
    
        function closeModal() {
            document.getElementById('creature-modal').classList.remove('active');
        }
        async function handleFileUpload(event) {
            const file = event.target.files[0];
            if (!file) return;
        
            const scriptUrl = "https://script.google.com/macros/s/AKfycbxtmxfP0xlAP-fK3UVEy_QzPbvAuQh-vJ_Vcs5iplYtC6xUOIO1b8YGzv-aKjfRH3aUWA/exec"; // <--- 記得改這行
        
            // 顯示上傳中狀態
            console.log("正在準備上傳...");
            const btn = event.target.nextElementSibling;
            const originalText = btn.innerText;
            btn.innerText = "上傳中...";
            btn.disabled = true;
        
            // 將圖片轉為 Base64 字串
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = async function () {
                const base64Data = reader.result.split(",")[1];
                const payload = {
                    base64: base64Data,
                    type: file.type,
                    name: file.name
                };
        
                // 在你的 handleFileUpload 函數內，找到 alert(result.message) 的地方：

                try {
                    const response = await fetch(scriptUrl, { method: "POST", body: JSON.stringify(payload) });
                    const result = await response.json();
                
                    if (result.isMatch) {
                        alert(result.message);
                        // --- 解鎖圖鑑邏輯 ---
                        // 假設你的 HTML img 的 src 包含了生物關鍵字
                        const allCreatures = document.querySelectorAll('.silhouette');
                        allCreatures.forEach(img => {
                            if (img.src.toLowerCase().includes(result.target)) {
                                img.classList.remove('silhouette'); // 移除濾鏡，變回彩色
                                img.style.filter = "none"; // 確保萬無一失
                            }
                        });
                    } else {
                        alert(result.message); // 顯示 "這個生物可能不在圖鑑中"
                    }
                } catch (error) {
                    alert("系統連線錯誤");
                }
            };
        }
    </script>
    <div id="creature-modal" class="modal" onclick="closeModal()">
        <div class="modal-content" onclick="event.stopPropagation()">
            <img id="modal-img" class="modal-img" src="" alt="Creature">
            <div class="hint-text">
                <p><strong>提示：</strong></p>
                <p id="modal-text"></p>
            </div>
        </div>
    </div>
</body>
</html>
